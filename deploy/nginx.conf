# Nginx configuration for SentinelGIS on Ubuntu VPS
# Location: /etc/nginx/sites-available/sentinelgis

server {
    listen 80;
    server_name _; # Replace with your domain or IP address (e.g. sentinelgis.yourdomain.com)

    # Allow larger PDF uploads (default is 1M, IDSP bulletins can be 5-15MB)
    client_max_body_size 25M;

    # Gzip compression for fast GeoJSON and bundle delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/geo+json;
    gzip_min_length 1000;

    # 1. API Endpoints -> Reverse Proxy to FastAPI / Gunicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
    }

    # Proxy ML Predict endpoint
    location /predict {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy legacy & documentation routes
    location ~ ^/(docs|openapi.json|geojson|risk-map) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Frontend Static Assets (Served directly by Nginx for high performance)
    # Adjust path if cloned into a different directory
    root /var/www/sentinelgis/frontend/build;
    index index.html;

    # Cache static assets (JS, CSS, images) for 30 days
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # SPA Client-Side Routing Fallback (Prevents 404 on page reload for /predictions, /analytics, /live)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
